[package]
name = "linux-monitor"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
sysinfo = "0.30.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utmp-rs = "0.4"
time = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
axum = "0.7"
